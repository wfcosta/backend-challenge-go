name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    name: Validar Go
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verificar formatação
        shell: bash
        run: |
          arquivos=$(gofmt -l .)
          test -z "$arquivos"

      - name: Baixar dependências
        run: go mod download

      - name: Testes unitários
        run: go test ./...

      - name: Testes com race detector
        run: go test -race ./...

      - name: Análise estática
        run: go vet ./...

      - name: Construir imagem Docker
        run: docker build -t backend-challenge-go:ci .

      - name: Subir infraestrutura de integração
        run: docker compose up --build -d

      - name: Executar integração contra Compose
        run: INTEGRATION=true go test ./tests/integracao -v

      - name: Derrubar infraestrutura
        if: always()
        run: docker compose down -v
