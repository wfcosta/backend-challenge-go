services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestration
      POSTGRES_PASSWORD: orchestration
      POSTGRES_DB: orchestration
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestration -d orchestration"]
      interval: 3s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://host.docker.internal:8080
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
  localstack:
    image: localstack/localstack:3.5
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports: ["4566:4566"]
  filas:
    image: amazon/aws-cli:2.17.14
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      localstack: {condition: service_started}
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        until aws --endpoint-url http://localstack:4566 sqs list-queues >/dev/null 2>&1; do sleep 2; done
        aws --endpoint-url http://localstack:4566 sqs create-queue --queue-name wager-transactions-dlq.fifo --attributes FifoQueue=true,ContentBasedDeduplication=true || true
        aws --endpoint-url http://localstack:4566 sqs create-queue --queue-name wager-transactions.fifo --attributes '{"FifoQueue":"true","ContentBasedDeduplication":"true","RedrivePolicy":"{\"deadLetterTargetArn\":\"arn:aws:sqs:us-east-1:000000000000:wager-transactions-dlq.fifo\",\"maxReceiveCount\":\"5\"}"}' || true
  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://orchestration:orchestration@postgres:5432/orchestration?sslmode=disable", "up"]
    depends_on:
      postgres: {condition: service_healthy}
  app:
    build: .
    environment:
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://orchestration:orchestration@postgres:5432/orchestration?sslmode=disable
      OIDC_ISSUER_URL: http://host.docker.internal:8080/realms/jungle-gaming
      OIDC_AUDIENCE: account
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      keycloak: {condition: service_healthy}
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    ports: ["8081:8081"]
