services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestration
      POSTGRES_PASSWORD: orchestration
      POSTGRES_DB: orchestration
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestration -d orchestration"]
      interval: 3s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports: ["8080:8080"]
  localstack:
    image: localstack/localstack:3.5
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports: ["4566:4566"]
  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://orchestration:orchestration@postgres:5432/orchestration?sslmode=disable", "up"]
    depends_on:
      postgres: {condition: service_healthy}
  app:
    build: .
    environment:
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://orchestration:orchestration@postgres:5432/orchestration?sslmode=disable
      OIDC_ISSUER_URL: http://keycloak:8080/realms/jungle-gaming
      OIDC_AUDIENCE: provider-a
    depends_on:
      keycloak: {condition: service_started}
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    ports: ["8081:8081"]
